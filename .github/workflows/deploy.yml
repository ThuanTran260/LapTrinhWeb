name: Deploy Static Website to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Stage static site deliverables
        shell: bash
        run: |
          STAGE_DIR="${{ runner.temp }}/_site"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp .nojekyll index.html "$STAGE_DIR/"
          cp -r admin pages css js assets "$STAGE_DIR/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '${{ runner.temp }}/_site'
          include-hidden-files: 'true'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
