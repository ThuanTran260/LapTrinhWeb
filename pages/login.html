<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập | ENERGY BOOST STORE</title>
  <meta name="description" content="Đăng nhập tài khoản Energy Boost Store để mua sắm nước tăng lực Monster Energy và Redbull chính hãng, nhận ưu đãi thành viên và theo dõi đơn hàng." />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="login-body-wrapper">

  <div class="login-card">
    <!-- Brand Logo -->
    <div class="login-logo">
      <a href="../index.html" class="logo">
        <div class="logo-icon" style="width: 52px; height: 52px; font-size: 1.8rem;">
          <i class="fas fa-bolt"></i>
        </div>
      </a>
    </div>

    <!-- Auth Mode Switcher Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">
        <i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP
      </button>
      <button type="button" class="auth-tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">
        <i class="fas fa-user-plus"></i> ĐĂNG KÝ
      </button>
    </div>

    <h1 class="login-title" id="auth-card-title">ĐĂNG NHẬP <span>ENERGY BOOST</span></h1>
    <p class="login-desc" id="auth-card-desc">Đăng nhập tài khoản để nhận ưu đãi thành viên và theo dõi đơn hàng:</p>

    <!-- Smart Login Form -->
    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-username"><i class="fas fa-envelope"></i> Email hoặc Tên đăng nhập</label>
        <input type="text" id="login-username" class="form-control" placeholder="email@example.com hoặc Tên tài khoản" autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password"><i class="fas fa-lock"></i> Mật khẩu</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="form-extra">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" checked /> Ghi nhớ đăng nhập
        </label>
        <a href="#" style="color: var(--primary);" onclick="showToast('Tính năng khôi phục mật khẩu đang cập nhật', 'info')">Quên mật khẩu?</a>
      </div>

      <!-- Single Submit Button -->
      <div class="login-actions">
        <button type="submit" class="btn-login-user">
          <i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP
        </button>
      </div>

      <p class="auth-switch-text">Chưa có tài khoản? <a href="javascript:void(0)" onclick="switchAuthTab('register')">Đăng ký thành viên ngay</a></p>
    </form>

    <!-- Static Registration Form (Rubric 1.6: Đăng ký làm người mua hàng) -->
    <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="register-fullname"><i class="fas fa-user"></i> Họ và tên người mua</label>
        <input type="text" id="register-fullname" class="form-control" placeholder="VD: Nguyễn Văn An" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-phone"><i class="fas fa-phone-alt"></i> Số điện thoại nhận hàng</label>
        <input type="tel" id="register-phone" class="form-control" placeholder="VD: 0912 345 678" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-email"><i class="fas fa-envelope"></i> Email / Tên tài khoản</label>
        <input type="text" id="register-email" class="form-control" placeholder="VD: vanan.nguyen@gmail.com" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="register-password"><i class="fas fa-lock"></i> Mật khẩu</label>
        <div class="password-wrapper">
          <input type="password" id="register-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password" />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('register-password', 'eye-icon-1')">
            <i class="fas fa-eye" id="eye-icon-1"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="register-confirm-password"><i class="fas fa-shield-alt"></i> Xác nhận mật khẩu</label>
        <div class="password-wrapper">
          <input type="password" id="register-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('register-confirm-password', 'eye-icon-2')">
            <i class="fas fa-eye" id="eye-icon-2"></i>
          </button>
        </div>
      </div>

      <div class="form-extra">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-muted);">
          <input type="checkbox" checked required /> Tôi đồng ý với Điều khoản dịch vụ và Chính sách thành viên Energy Boost
        </label>
      </div>

      <div class="login-actions">
        <button type="submit" class="btn-login-user" style="background: linear-gradient(135deg, var(--primary) 0%, #00B0FF 100%);">
          <i class="fas fa-user-plus"></i> ĐĂNG KÝ TÀI KHOẢN
        </button>
      </div>

      <p class="auth-switch-text">Đã có tài khoản? <a href="javascript:void(0)" onclick="switchAuthTab('login')">Đăng nhập ngay</a></p>
    </form>

    <a href="../index.html" class="back-home-link">
      <i class="fas fa-arrow-left"></i> Quay lại trang chủ mua sắm
    </a>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="../js/app.js"></script>
</body>
</html>
