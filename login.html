<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập | MONSTER ENERGY STORE</title>
  <meta name="description" content="Đăng nhập tài khoản Monster Energy Store để mua sắm, nhận ưu đãi thành viên và theo dõi đơn hàng." />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body-wrapper">

  <div class="login-card">
    <!-- Brand Logo -->
    <div class="login-logo">
      <a href="index.html" class="logo">
        <div class="logo-icon" style="width: 52px; height: 52px; font-size: 1.8rem;">
          <i class="fas fa-bolt"></i>
        </div>
      </a>
    </div>

    <h1 class="login-title">ĐĂNG NHẬP <span>MONSTER</span></h1>
    <p class="login-desc">Đăng nhập tài khoản để nhận ưu đãi thành viên và theo dõi đơn hàng:</p>

    <!-- Smart Login Form -->
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-username"><i class="fas fa-envelope"></i> Email hoặc Tên đăng nhập</label>
        <input type="text" id="login-username" class="form-control" placeholder="email@example.com hoặc Tên tài khoản" autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password"><i class="fas fa-lock"></i> Mật khẩu</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="form-extra">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <input type="checkbox" checked /> Ghi nhớ đăng nhập
        </label>
        <a href="#" style="color: var(--primary);" onclick="showToast('Tính năng khôi phục mật khẩu đang cập nhật', 'info')">Quên mật khẩu?</a>
      </div>

      <!-- Single Submit Button -->
      <div class="login-actions">
        <button type="submit" class="btn-login-user">
          <i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP
        </button>
      </div>
    </form>

    <a href="index.html" class="back-home-link">
      <i class="fas fa-arrow-left"></i> Quay lại trang chủ mua sắm
    </a>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
